[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "traderbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "websockets>=12.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "schedule>=1.2",
    "python-telegram-bot>=21.0",
    "loguru>=0.7",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
